<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stock Analysis Agent</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1b1f24;
    --muted: #6b7280;
    --border: #e4e7ec;
    --accent: #2563eb;
    --buy: #16a34a;
    --sell: #dc2626;
    --hold: #d97706;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --ink: #e8eaed;
      --muted: #9aa4b2;
      --border: #262b36;
      --accent: #60a5fa;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 22px clamp(16px, 4vw, 40px);
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 1040px; margin: 0 auto; padding: clamp(16px, 4vw, 32px); }

  .controls {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; box-shadow: var(--shadow);
  }
  .controls input {
    flex: 1 1 260px; min-width: 0;
    padding: 9px 12px; font-size: 14px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--ink);
  }
  .controls button {
    padding: 9px 18px; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  .controls button:disabled { opacity: .55; cursor: progress; }
  .hint { color: var(--muted); font-size: 12px; margin: 8px 2px 0; }

  #status { margin: 18px 2px; color: var(--muted); font-size: 14px; }
  #status.error { color: var(--sell); }

  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-top: 18px; box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 12px; font-size: 15px; }

  .verdict { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .badge {
    font-size: 20px; font-weight: 800; letter-spacing: .02em;
    padding: 4px 14px; border-radius: 999px; color: #fff;
  }
  .badge.Buy { background: var(--buy); }
  .badge.Sell { background: var(--sell); }
  .badge.Hold { background: var(--hold); }
  .verdict .meta { color: var(--muted); font-size: 12px; }
  .thesis { margin: 14px 0 0; padding-left: 20px; }
  .thesis li { margin: 6px 0; }
  .warn {
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    background: color-mix(in srgb, var(--hold) 14%, transparent);
    color: var(--hold); font-size: 13px;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  td.pos { color: var(--buy); }
  td.neg { color: var(--sell); }

  .chart-wrap { position: relative; height: 300px; }
  .chart-wrap.short { height: 220px; }

  .ticker-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ticker-head .px { font-size: 13px; color: var(--muted); }

  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre {
    overflow-x: auto; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.5;
  }
  .failed { color: var(--sell); font-size: 13px; margin: 4px 0; }

  /* ---- Agent 3 three-section report ---- */
  .card h3 {
    margin: 22px 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
  }
  .report .badge { font-size: 17px; padding: 3px 12px; }
  .report h3:first-of-type { margin-top: 16px; }
  .thesis-prose p { margin: 8px 0; font-size: 13.5px; line-height: 1.6; }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li {
    border-left: 2px solid var(--border); padding: 0 0 14px 14px; position: relative;
  }
  .timeline li::before {
    content: ""; position: absolute; left: -5px; top: 4px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline .date { font-weight: 700; font-size: 13px; }
  .timeline .headline { font-size: 13px; }
  .timeline .headline a { color: var(--accent); }
  .timeline .react { font-size: 12.5px; color: var(--ink); margin-top: 2px; }
  .timeline .react b, .timeline .cause b { color: var(--muted); font-weight: 600; }
  .timeline .cause { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  table.scen { font-size: 12.5px; margin-top: 4px; }
  table.scen th, table.scen td { text-align: left; vertical-align: top; }
  table.scen td:first-child { white-space: nowrap; font-weight: 700; }
  table.scen .bull { color: var(--buy); }
  table.scen .bear { color: var(--sell); }
  table.scen .base { color: var(--hold); }
  table.scen .prob { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .risks { margin: 6px 0 0; padding-left: 20px; }
  .risks li { margin: 5px 0; font-size: 13px; }

  .headlines { list-style: none; margin: 10px 0 0; padding: 0; font-size: 12px; }
  .headlines li { margin: 4px 0; color: var(--muted); }
  .headlines a { color: var(--accent); }
  .headlines .d { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Stock Analysis Agent</h1>
  <p>Agents&nbsp;1&ndash;2.5 (prices ∥ SEC filings ∥ Tavily news) → Agent&nbsp;3 (Gemini) → per-ticker thesis, dated catalyst timeline &amp; scenario matrix</p>
</header>

<main>
  <div class="controls">
    <input id="tickers" type="text" value="AAPL, NVDA, MSFT"
           placeholder="Comma-separated tickers, e.g. AAPL, NVDA, MSFT"
           autocomplete="off" spellcheck="false" />
    <button id="run">Analyze</button>
  </div>
  <p class="hint">A full run fetches live prices, SEC filings and news, then calls the LLM for a per-ticker report — allow up to ~90&nbsp;seconds.</p>

  <div id="status" hidden></div>
  <div id="results"></div>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
const charts = [];
const fmtUSD = (v) => v == null ? "—" : v.toLocaleString(undefined, { style: "currency", currency: "USD" });
const fmtPct = (v) => v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
const fmtRSI = (v) => {
  if (v == null) return "—";
  const s = v.toFixed(1);
  if (v > 70) return `<span class="neg" title="Overbought (RSI &gt; 70)">${s} ▲</span>`;
  if (v < 30) return `<span class="pos" title="Oversold (RSI &lt; 30)">${s} ▼</span>`;
  return s;
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function destroyCharts() {
  while (charts.length) charts.pop().destroy();
}

async function analyze() {
  const raw = $("#tickers").value.split(",").map((s) => s.trim().toUpperCase()).filter(Boolean);
  const tickers = [...new Set(raw)];
  if (!tickers.length) { setStatus("Enter at least one ticker.", true); return; }

  $("#run").disabled = true;
  destroyCharts();
  $("#results").innerHTML = "";
  setStatus(`Running the pipeline for ${tickers.join(", ")} … this can take up to ~90s.`);

  const started = performance.now();
  try {
    const res = await fetch("analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tickers }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || `HTTP ${res.status}`);
    const secs = ((performance.now() - started) / 1000).toFixed(1);
    setStatus(`Done in ${secs}s · status: ${data.status}`);
    render(data.state);
  } catch (err) {
    setStatus(`Request failed: ${err.message}`, true);
  } finally {
    $("#run").disabled = false;
  }
}

function setStatus(msg, isError = false) {
  const el = $("#status");
  el.hidden = false;
  el.textContent = msg;
  el.classList.toggle("error", isError);
}

function render(state) {
  const root = $("#results");
  const decision = state.final_decision;
  const newsByTicker = {};
  (state.news_context || []).forEach((n) => { newsByTicker[n.ticker] = n; });

  if (decision && decision.error) {
    const c = card("");
    c.innerHTML = `<div class="warn">⚠ Agent 3 degraded: ${esc(decision.error)}</div>`;
    root.appendChild(c);
  }

  const reports = (decision && decision.reports) || [];
  reports.forEach((r) => root.appendChild(reportCard(r)));

  if (decision && (decision.cross_cutting_risks || []).length) {
    const c = card("Cross-cutting risks");
    c.innerHTML += `<ul class="risks">${
      decision.cross_cutting_risks.map((x) => `<li>${esc(x)}</li>`).join("")
    }</ul>`;
    root.appendChild(c);
  }

  const hist = state.historical_data || [];
  if (hist.length) {
    root.appendChild(returnsCard(hist));
    root.appendChild(metricsCard(hist));
    hist.forEach((h) => root.appendChild(tickerCard(h, newsByTicker[h.ticker])));
  }

  const failed = state.failed_tickers || [];
  if (failed.length) {
    const c = card("Could not process");
    failed.forEach((f) => {
      const p = document.createElement("p");
      p.className = "failed";
      p.textContent = `${f.ticker}: ${f.error}`;
      c.appendChild(p);
    });
    root.appendChild(c);
  }

  if (decision) {
    const meta = decision.model
      ? `${decision.model}${decision.generated_at ? " · " + new Date(decision.generated_at).toLocaleString() : ""}`
      : "";
    if (meta) {
      const p = document.createElement("p");
      p.className = "hint";
      p.textContent = `Report by ${meta}`;
      root.appendChild(p);
    }
    if (decision.critic_notes) {
      root.appendChild(rawDetails("Critic notes (Agent 3 reflection pass)", decision.critic_notes));
    }
  }
  root.appendChild(rawDetails("Fundamental report (Agent 2)", state.fundamental_report || "(none)"));
  root.appendChild(rawDetails("Full response JSON", JSON.stringify(state, null, 2)));
}

const CASE_LABEL = { bull: "Bull", base: "Base", bear: "Bear" };

function reportCard(r) {
  const c = card("");
  c.className = "card report";
  const rec = r.recommendation || "Hold";
  c.innerHTML = `
    <div class="verdict">
      <span class="badge ${esc(rec)}">${esc(rec)}</span>
      <h2 style="margin:0">${esc(r.ticker)}</h2>
    </div>

    <h3>Executive thesis &amp; valuation drivers</h3>
    <div class="thesis-prose">${
      String(r.executive_thesis || "")
        .split(/\n{2,}/).map((p) => `<p>${esc(p.trim())}</p>`).join("")
    }</div>

    <h3>Timeline of dated news catalysts &amp; price impact</h3>
    ${
      (r.catalyst_timeline || []).length
        ? `<ul class="timeline">${(r.catalyst_timeline || []).map(catalystRow).join("")}</ul>`
        : `<p class="hint">No dated catalysts available for this ticker.</p>`
    }

    <h3>Scenario matrix &amp; downside risks</h3>
    ${scenarioTable(r.scenarios || [])}
    ${
      (r.downside_risks || []).length
        ? `<ul class="risks">${(r.downside_risks || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`
        : ""
    }
  `;
  return c;
}

function catalystRow(k) {
  const src = k.source
    ? (/^https?:\/\//.test(k.source)
        ? ` <a href="${esc(k.source)}" target="_blank" rel="noopener">source</a>`
        : ` <span style="color:var(--muted)">(${esc(k.source)})</span>`)
    : "";
  return `<li>
    <div class="date">${esc(k.date || "—")}</div>
    <div class="headline">${esc(k.headline || "")}${src}</div>
    <div class="react"><b>Reaction:</b> ${esc(k.market_reaction || "—")}</div>
    <div class="cause"><b>Causal impact:</b> ${esc(k.causal_impact || "—")}</div>
  </li>`;
}

function scenarioTable(scen) {
  if (!scen.length) return `<p class="hint">No scenarios returned.</p>`;
  const order = { bull: 0, base: 1, bear: 2 };
  const rows = [...scen].sort((a, b) => (order[a.case] ?? 9) - (order[b.case] ?? 9)).map((s) => `
    <tr>
      <td class="${esc(s.case)}">${esc(CASE_LABEL[s.case] || s.case || "—")}</td>
      <td class="prob">${s.probability == null ? "—" : Math.round(s.probability * 100) + "%"}</td>
      <td>${esc(s.drivers || "—")}</td>
      <td><b style="color:var(--muted)">Invalidation:</b> ${esc(s.invalidation_trigger || "—")}</td>
    </tr>`).join("");
  return `<div style="overflow-x:auto"><table class="scen">
    <thead><tr><th>Case</th><th class="prob">Prob.</th><th>Drivers</th><th>Invalidation trigger</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function card(title) {
  const c = document.createElement("div");
  c.className = "card";
  if (title) {
    const h = document.createElement("h2");
    h.textContent = title;
    c.appendChild(h);
  }
  return c;
}

function metricsCard(hist) {
  const c = card("Quantitative metrics");
  const rows = hist.map((h) => `
    <tr>
      <td>${esc(h.ticker)}</td>
      <td>${fmtUSD(h.latest_close)}</td>
      <td class="${h.pct_return >= 0 ? "pos" : "neg"}">${fmtPct(h.pct_return)}</td>
      <td>${fmtUSD(h.moving_averages?.ma_50)}</td>
      <td>${fmtUSD(h.moving_averages?.ma_200)}</td>
      <td>${fmtRSI(h.rsi_14)}</td>
      <td>${h.data_points}</td>
      <td>${esc(h.period_start)} → ${esc(h.period_end)}</td>
    </tr>`).join("");
  c.innerHTML += `
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th>Ticker</th><th>Last close</th><th>6-mo return</th>
          <th>MA-50</th><th>MA-200</th><th>RSI-14</th><th>Days</th><th>Window</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  return c;
}

function returnsCard(hist) {
  const c = card("6-month return");
  const wrap = document.createElement("div");
  wrap.className = "chart-wrap short";
  const canvas = document.createElement("canvas");
  wrap.appendChild(canvas);
  c.appendChild(wrap);
  const buy = cssVar("--buy"), sell = cssVar("--sell");
  charts.push(new Chart(canvas, {
    type: "bar",
    data: {
      labels: hist.map((h) => h.ticker),
      datasets: [{
        label: "Return %",
        data: hist.map((h) => h.pct_return),
        backgroundColor: hist.map((h) => (h.pct_return >= 0 ? buy : sell)),
        borderRadius: 4,
      }],
    },
    options: baseOpts({ yTitle: "%" }),
  }));
  return c;
}

function tickerCard(h, news) {
  const c = card("");
  const head = document.createElement("div");
  head.className = "ticker-head";
  head.innerHTML = `<h2 style="margin:0">${esc(h.ticker)}</h2>
    <span class="px">${fmtUSD(h.latest_close)} · ${fmtPct(h.pct_return)} · ${h.data_points} days</span>`;
  c.appendChild(head);

  const series = h.price_history || [];
  if (!series.length) {
    const p = document.createElement("p");
    p.className = "hint";
    p.textContent = "No price series returned for this ticker.";
    c.appendChild(p);
    appendHeadlines(c, news);
    return c;
  }

  const wrap = document.createElement("div");
  wrap.className = "chart-wrap";
  const canvas = document.createElement("canvas");
  wrap.appendChild(canvas);
  c.appendChild(wrap);

  const ink = cssVar("--ink"), accent = cssVar("--accent"), muted = cssVar("--muted");
  charts.push(new Chart(canvas, {
    type: "line",
    data: {
      labels: series.map((p) => p.date),
      datasets: [
        { label: "Close", data: series.map((p) => p.close), borderColor: accent, borderWidth: 2, pointRadius: 0, tension: .15 },
        { label: "MA-50", data: series.map((p) => p.ma_50), borderColor: ink, borderWidth: 1, pointRadius: 0, borderDash: [5, 4] },
        { label: "MA-200", data: series.map((p) => p.ma_200), borderColor: muted, borderWidth: 1, pointRadius: 0, borderDash: [2, 3] },
      ],
    },
    options: baseOpts({ yTitle: "USD", xTicks: 8 }),
  }));
  appendHeadlines(c, news);
  return c;
}

function appendHeadlines(container, news) {
  const items = (news && news.items) || [];
  if (!items.length) return;
  const ul = document.createElement("ul");
  ul.className = "headlines";
  ul.innerHTML = items.slice(0, 6).map((it) => {
    const d = it.published_date ? `<span class="d">${esc(it.published_date.slice(0, 10))}</span> · ` : "";
    return `<li>${d}<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></li>`;
  }).join("");
  const h = document.createElement("h3");
  h.textContent = "Recent headlines";
  container.appendChild(h);
  container.appendChild(ul);
}

function baseOpts({ yTitle, xTicks = 6 } = {}) {
  const grid = cssVar("--border"), muted = cssVar("--muted");
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: { legend: { labels: { color: muted, boxWidth: 12 } } },
    scales: {
      x: { grid: { color: grid }, ticks: { color: muted, maxTicksLimit: xTicks, autoSkip: true } },
      y: {
        grid: { color: grid },
        ticks: { color: muted },
        title: yTitle ? { display: true, text: yTitle, color: muted } : undefined,
      },
    },
  };
}

function rawDetails(summary, text) {
  const d = document.createElement("details");
  d.innerHTML = `<summary>${esc(summary)}</summary><pre>${esc(text)}</pre>`;
  return d;
}

$("#run").addEventListener("click", analyze);
$("#tickers").addEventListener("keydown", (e) => { if (e.key === "Enter") analyze(); });
</script>
</body>
</html>
