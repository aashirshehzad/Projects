[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hybrid-code-auditor"
version = "1.0.0"
description = "Hybrid AST + single-call LLM code auditor and remediation engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muhammad Aashir Shehzad" }]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "google-genai>=1.0",
    "openai>=1.40",
    "requests>=2.31",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
code-auditor = "app.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
